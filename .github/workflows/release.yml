name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run render tests
        run: |
          pip install python-liquid
          python3 tests/render_test.py
      - name: Build plugin ZIP
        run: |
          zip -j icl-week-calendar.zip \
              icl-week-calendar/settings.yml \
              icl-week-calendar/full.liquid \
              icl-week-calendar/half_horizontal.liquid \
              icl-week-calendar/half_vertical.liquid \
              icl-week-calendar/quadrant.liquid
          unzip -l icl-week-calendar.zip
      - name: Create GitHub release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          files: icl-week-calendar.zip
          generate_release_notes: true
          body: |
            TRMNL-format plugin (LaraPaper / TRMNL Cloud): rolling 7-day view
            from a Fastmail ICS feed.

            **Install:** Plugins → Import Recipe Archive → upload `icl-week-calendar.zip`
            (LaraPaper) or Devices → Add Plugin (TRMNL).

            See README for configuration fields and notes.
